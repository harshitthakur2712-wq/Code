<html>
	<head>
		<title>Chess</title>
		<style>
			#ChessBoard
			{
			height:1920px;
			width:1920px;
			border:10px solid;
			border-color:black;
			}
			#white
			{
			height:240px;
			width:240px;
			font-size:150px;
			text-shadow:5px 3px white;
			background-color:white;
			float:left;
			}
			#black
			{
			height:240px;	
			width:240px;
			font-size:150px;
			text-shadow:5px 3px white;
			background-color:black;
			float:left;
			}
		</style>
	</head>
	<body>
		<center>
			<div id="ChessBoard">
				<div id="1st row">
					<div id="white">&#9820;</div> <div id="black">&#9822;</div> 
					<div id="white">&#9821</div> <div id="black">&#9818</div> 
					<div id="white">&#9819</div> <div id="black">&#9821</div> 
					<div id="white">&#9822;</div> <div id="black">&#9820;</div>		
				</div>
				<div id="2nd row">
					<div id="black">&#9823;</div> <div id="white">&#9823;</div> 
					<div id="black">&#9823;</div> <div id="white">&#9823;</div> 
					<div id="black">&#9823;</div> <div id="white">&#9823;</div> 
					<div id="black">&#9823;</div> <div id="white">&#9823;</div>	
				</div>
				<div id="3rd row">
					<div id="white"></div> <div id="black"></div> 
					<div id="white"></div> <div id="black"></div> 
					<div id="white"></div> <div id="black"></div> 
					<div id="white"></div> <div id="black"></div>
				</div>		
				<div id="4th row">
					<div id="black"></div> <div id="white"></div> 
					<div id="black"></div> <div id="white"></div> 
					<div id="black"></div> <div id="white"></div> 
					<div id="black"></div> <div id="white"></div>		
				</div>
				<div id="5th row">
					<div id="white"></div> <div id="black"></div> 
					<div id="white"></div> <div id="black"></div> 
					<div id="white"></div> <div id="black"></div> 
					<div id="white"></div> <div id="black"></div>		
				</div>
				<div id="6th row">
					<div id="black"></div> <div id="white"></div> 
					<div id="black"></div> <div id="white"></div> 
					<div id="black"></div> <div id="white"></div> 
					<div id="black"></div> <div id="white"></div>
				</div>		
				<div id="7th row">
					<div id="white">&#9817;</div> <div id="black">&#9817;</div> 
					<div id="white">&#9817;</div> <div id="black">&#9817;</div> 
					<div id="white">&#9817;</div> <div id="black">&#9817;</div> 
					<div id="white">&#9817;</div> <div id="black">&#9817;</div>		
				</div>
				<div id="8th row">
					<div id="black">&#9814;</div> <div id="white">&#9816;</div> 
					<div id="black">&#9815;</div> <div id="white">&#9812;</div> 
					<div id="black">&#9813;</div> <div id="white">&#9815;</div> 
					<div id="black">&#9816;</div> <div id="white">&#9814;</div>		
				</div>
			</div>
		</center>
	</body>
</html>
